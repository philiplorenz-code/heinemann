apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: api-canary
  namespace: demo
spec:
  hosts: [api-service]
  http:
  - match:
    - headers:
        x-canary: {exact: "true"}
    route:
    - destination: {host: api-service, subset: v2}
  - route:
    - destination: {host: api-service, subset: v1}
      weight: 90
    - destination: {host: api-service, subset: v2}
      weight: 10
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: api-versions
  namespace: demo
spec:
  host: api-service
  subsets:
  - name: v1
    labels: {version: v1}
  - name: v2
    labels: {version: v2}
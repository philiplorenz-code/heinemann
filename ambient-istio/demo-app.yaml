apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-service
  namespace: demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: client
  namespace: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-v1
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels: {app: api-service, version: v1}
  template:
    metadata:
      labels: {app: api-service, version: v1}
    spec:
      serviceAccountName: api-service
      containers:
      - name: api
        image: hashicorp/http-echo
        args: ["-text=v1", "-listen=:80"]
        ports: [{containerPort: 80}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-v2
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: api-service, version: v2}
  template:
    metadata:
      labels: {app: api-service, version: v2}
    spec:
      serviceAccountName: api-service
      containers:
      - name: api
        image: hashicorp/http-echo
        args: ["-text=v2", "-listen=:80"]
        ports: [{containerPort: 80}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: client}
  template:
    metadata:
      labels: {app: client}
    spec:
      serviceAccountName: client
      containers:
      - name: client
        image: curlimages/curl:latest
        command: ["/bin/sleep", "infinity"]
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: demo
spec:
  selector: {app: api-service}
  ports: [{port: 80, targetPort: 80}]